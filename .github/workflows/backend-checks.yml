name: Backend checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start disposable local backend and apply migrations
        run: npx --yes supabase@2.121.0 start
      - name: Test ownership, roles, sessions and private storage
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file supabase/tests/phase1_identity.sql
      - name: Test admin parallel sessions and unchanged student limits
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file supabase/tests/phase1_admin_sessions.sql
      - name: Test course/session metadata and admin access
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file supabase/tests/phase2_content.sql
      - name: Test private course covers and retirement rules
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file supabase/tests/phase2_covers.sql
      - name: Test admin material authoring and protected payload separation
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file supabase/tests/phase2_materials.sql
      - name: Test published catalog search, filters and admission boundary
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file supabase/tests/phase2_catalog.sql
      - name: Stop this runner's disposable backend
        if: always()
        run: npx --yes supabase@2.121.0 stop --project-id Summit-engineering-academy --no-backup
